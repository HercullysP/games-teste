<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050805">
<title>Floresta dos Mortos</title>
<style>
  html,body{margin:0;height:100%;background:#050805;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{position:fixed;inset:0}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;background:#000;box-shadow:0 0 40px #000;touch-action:none}
  #ctl{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
  #ctl.on{display:block}
  .tb{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.55);color:#fff;box-sizing:border-box;
      font:bold 15px sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
  .tb.down{background:rgba(255,255,255,.4);border-color:#fff;transform:scale(.94)}
  .tb.g{font-weight:900;letter-spacing:.5px}
  #ctl:not([data-state=play]) .g{display:none}
  #ctl:not([data-state=play]):not([data-state=paused]) #b-pause{display:none}
  #som{position:fixed;inset:0;pointer-events:none;z-index:6}
  #som .tb{pointer-events:auto;cursor:pointer}
  #som .tb.off{opacity:.45;text-decoration:line-through}
  #rot{position:fixed;inset:0;z-index:10;background:#050805f2;color:#fff;display:none;flex-direction:column;align-items:center;
      justify-content:center;font:bold 22px sans-serif;text-align:center;padding:20px}
  #rot.on{display:flex}
  #rot .ico{font-size:64px;animation:gira 1.6s ease-in-out infinite}
  @keyframes gira{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>

<script>
// =====================================================================

const PERSONAGENS = [
  { nome: 'ErcsP', foto: FOTO.jogador1, cor: '#c62828' },
  { nome: 'Maconha', foto: FOTO.jogador2, cor: '#1565c0' },
  { nome: 'Parlim', foto: FOTO.jogador3, cor: '#f9a825' },

  { nome: 'Reifiel', foto: FOTO.jogador5, cor: '#00897b' },
];
const ZUMBIS = [ // rostos dos zumbis (recebem tom esverdeado). O brutamontes usa TODOS de uma vez.
  { foto: FOTO.zumbi1 }, { foto: FOTO.zumbi2 }, { foto: FOTO.zumbi3 }, { foto: FOTO.zumbi4 },
];
const ARMAS = [
  { nome: 'Pistola',  pente: 12, reserva: Infinity, cadencia: 0.22, recarga: 0.9, dano: 1, balas: 1, disp: 0.03, vel: 950,  alcance: 650, coice: 0,   tremor: 1 },
  { nome: 'Escopeta', pente: 6,  reserva: 24,       cadencia: 0.75, recarga: 1.4, dano: 1, balas: 6, disp: 0.2,  vel: 850,  alcance: 320, coice: 170, tremor: 6 },
  { nome: 'Fuzil',    pente: 30, reserva: 90,       cadencia: 0.09, recarga: 1.6, dano: 1, balas: 1, disp: 0.06, vel: 1100, alcance: 750, coice: 15,  tremor: 2, desbloqueiaNaRodada: 3 },
];

(() => {
'use strict';
const T = 32, VW = 800, VH = 480, ROWS = 15, DT = 1 / 60;
const PHYS = { accel: 2600, airAccel: 1700, maxSpeed: 240, friction: 2400, gravity: 1850,
  jumpVel: 690, jumpCut: 0.45, maxFall: 900, coyote: 0.1, jumpBuffer: 0.12 };
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function fit() {
  // no celular, reserva as laterais para os botões pequenos (som/música/tela cheia/pausa) não cobrirem o HUD
  const sa = typeof saProbe !== 'undefined' ? safeArea() : { l: 0, r: 0 }, side = (typeof isTouch !== 'undefined' && isTouch) ? 64 : 0;
  const s = Math.min((innerWidth - 2 * side - sa.l - sa.r) / VW, innerHeight / VH); canvas.style.width = Math.floor(VW * s) + 'px'; canvas.style.height = Math.floor(VH * s) + 'px';
  if (typeof layoutButtons === 'function') layoutButtons();
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

// ====== Rostos (foto recortada em círculo ou rosto desenhado) ======
const SKINS = ['#f2c18d', '#c68642', '#8d5524', '#e0ac69', '#ffdbac', '#a1665e'];
const HAIRS = ['#2a1a0a', '#111', '#6b3e1e', '#d4a017', '#444', '#8b2500'];
function makeFace(def, zombie, idx) {
  const f = { def, zombie, idx, img: null, cv: null };
  if (def.foto) { const im = new Image(); im.onload = () => { f.img = im; f.cv = null; }; im.onerror = () => {}; im.src = def.foto; }
  return f;
}
function placeholderFace(c, f) {
  const i = f.idx, S = 64;
  c.fillStyle = f.zombie ? '#cfd8c0' : SKINS[i % SKINS.length]; c.fillRect(0, 0, S, S);
  c.fillStyle = HAIRS[(i * 2 + 1) % HAIRS.length];
  if (f.zombie) { for (let k = 0; k < 7; k++) { c.beginPath(); c.moveTo(6 + k * 8, 0); c.lineTo(10 + k * 8, 16 + (k * 5) % 9); c.lineTo(14 + k * 8, 0); c.fill(); } }
  else { c.fillRect(0, 0, S, 14 + (i % 3) * 3); if (i % 2) c.fillRect(0, 0, 8, 34); }
  if (f.zombie) {
    c.fillStyle = '#2a0000'; c.beginPath(); c.arc(22, 30, 7, 0, 7); c.arc(43, 28, 5 + i % 3, 0, 7); c.fill();
    c.fillStyle = '#ff3030'; c.fillRect(20, 29, 3, 3); c.fillRect(42, 27, 3, 3);
    c.fillStyle = '#3a0a0a'; c.fillRect(18, 46, 28, 7);
    c.fillStyle = '#eee'; for (let k = 0; k < 5; k++) c.fillRect(20 + k * 5, 46, 3, 4);
    c.strokeStyle = '#5a1a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(8, 20 + i * 3); c.lineTo(16, 40); c.stroke();
  } else {
    c.fillStyle = '#fff'; c.fillRect(17, 26, 10, 8); c.fillRect(37, 26, 10, 8);
    c.fillStyle = '#222'; c.fillRect(21, 27, 5, 6); c.fillRect(41, 27, 5, 6);
    c.fillStyle = '#00000033'; c.fillRect(29, 34, 6, 8);
    c.fillStyle = '#7a2a2a'; c.beginPath(); c.arc(32, 45, 9, 0.15, Math.PI - 0.15); c.fill();
      }
}
function faceCanvas(f) {
  if (f.cv) return f.cv;
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d');
  c.save(); c.beginPath(); c.arc(32, 32, 31, 0, 7); c.clip();
  if (f.img) { const s = Math.max(64 / f.img.width, 64 / f.img.height); const w = f.img.width * s, h = f.img.height * s; c.drawImage(f.img, (64 - w) / 2, (64 - h) / 2, w, h); }
  else placeholderFace(c, f);

    c.globalCompositeOperation = 'multiply'; c.fillStyle = '#8fe07a'; c.fillRect(0, 0, 64, 64);
    c.globalCompositeOperation = 'source-over'; c.fillStyle = 'rgba(40,120,30,0.28)'; c.fillRect(0, 0, 64, 64);

  c.lineWidth = 3; c.strokeStyle = f.zombie ? '#1d3a12' : '#111'; c.beginPath(); c.arc(32, 32, 30.5, 0, 7); c.stroke();
  return (f.cv = cv);
}
const heroFaces = PERSONAGENS.map((p, i) => makeFace(p, false, i));
const zombieFaces = ZUMBIS.map((z, i) => makeFace(z, true, i));

// ====== Arena da floresta ======
const LW = 70, LH = ROWS;
const grid = Array.from({ length: LH }, () => new Array(LW).fill(0));
for (let x = 0; x < LW; x++) for (let y = 12; y < LH; y++) grid[y][x] = 1;
// troncos (plataformas atravessáveis por baixo): [x, linha, comprimento]
for (const [x, y, n] of [[5, 9, 4], [17, 9, 5], [32, 9, 6], [49, 9, 5], [61, 9, 4], [11, 6, 4], [25, 6, 4], [41, 6, 4], [55, 6, 4], [33, 3, 4]])
  for (let k = 0; k < n; k++) grid[y][x + k] = 2;
for (const x of [14, 28, 45, 58]) grid[11][x] = 3; // pedras
const solidH = (tx, ty) => tx < 0 || tx >= LW || (ty >= 0 && ty < LH && (grid[ty][tx] === 1 || grid[ty][tx] === 3));

// Árvores do fundo (parallax)
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const r0 = rnd(7);
const treeLayers = [0.2, 0.45, 0.7].map((par, li) => ({ par, col: ['#0f2a1c', '#0b2015', '#07160e'][li], trees: Array.from({ length: 26 }, (_, i) => ({ x: i * 120 + r0() * 90, h: 160 + r0() * 140 + li * 30, w: 50 + r0() * 30 + li * 10 })) }));
const fireflies = Array.from({ length: 30 }, () => ({ x: r0() * LW * T, y: 120 + r0() * 250, p: r0() * 6 }));

// ====== Áudio procedural (WebAudio) ======
// Tudo é sintetizado: nenhum arquivo de som. Cada efeito é uma função (ctx, saída, tempo, opções)

    if (blink() && stateTimer > 1) text(confirmMsg() + ' para jogar de novo', VW / 2, 330, 22, '#fff');
  }
}

let last = performance.now(), acc = 0;
function frame(now) { if (ctl.dataset.state !== state) ctl.dataset.state = state; if (actx) { syncAudio(); musicaPorEstado(); } acc += Math.min(0.1, (now - last) / 1000); last = now; while (acc >= DT) { update(DT); acc -= DT; } draw(); requestAnimationFrame(frame); }
fit();
requestAnimationFrame(frame);

// Gancho para testes automatizados
window.__audio = { SFX, createMusic, play, sfx, get voices() { return voices; }, get actx() { return actx; }, somCfg, VOZES_MAX };
window.__game = { get state() { return state; }, set state(v) { state = v; }, get player() { return player; }, get zombies() { return zombies; },
  get round() { return round; }, get phase() { return phase; }, get lives() { return lives; }, get score() { return score; }, get kills() { return kills; },
  get toSpawn() { return toSpawn; }, keys, startRound: n => startRound(n), get cam() { return cam; }, update, startGame, fire, swapWeapon, spawnZombie, faceCanvas, heroFaces, zombieFaces };
})();
